name: Tests

# Klikt bij elke wijziging automatisch op alle knoppen van de app (zie test/knoppen.test.cjs).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  knoppen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versienummer gelijk in sw.js en app.js
        run: node test/versie.test.cjs
      - name: Recepten uit pdf inlezen
        run: node test/recepten.test.cjs
      - name: Playwright installeren
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Alle knoppen aanklikken
        run: node test/knoppen.test.cjs
      - name: Back-up van toestel A naar B terugzetten
        run: node test/backup.test.cjs
      - name: Prijzen per winkel en winkellijsten
        run: node test/winkels.test.cjs
      - name: Eigen eenheden toevoegen en verwijderen
        run: node test/eenheden.test.cjs
      - name: Hetzelfde product meermaals op de boodschappenlijst
        run: node test/boodschappen.test.cjs
      - name: Catalogus toevoegen, bewerken en verwijderen
        run: node test/catalogus.test.cjs
      - name: Minimum voor alle merken samen en boodschappen met elk merk
        run: node test/minimum.test.cjs
      - name: Kleine en grote verpakkingen
        run: node test/verpakking.test.cjs
      - name: Geopende verpakkingen en voorraad per categorie
        run: node test/geopend.test.cjs
      - name: Maaltijdplanner
        run: node test/planner.test.cjs
      - name: Bewaren in een bestand op het toestel
        run: node test/bestand.test.cjs
      - name: Synchroniseren tussen toestellen
        run: node test/sync.test.cjs
      - name: Grote verpakking verdeeld over potten
        run: node test/potten.test.cjs
      - name: Scherm aan laten tijdens het koken
        run: node test/scherm.test.cjs
      - name: Niets steekt buiten een smal telefoonscherm uit
        run: node test/breedte.test.cjs
