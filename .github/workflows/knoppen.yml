name: Tests

# Klikt bij elke wijziging automatisch op alle knoppen van de app (zie test/knoppen.test.cjs).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  knoppen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recepten uit pdf inlezen
        run: node test/recepten.test.cjs
      - name: Playwright installeren
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Alle knoppen aanklikken
        run: node test/knoppen.test.cjs
      - name: Back-up van toestel A naar B terugzetten
        run: node test/backup.test.cjs
      - name: Prijzen per winkel en winkellijsten
        run: node test/winkels.test.cjs
      - name: Maaltijdplanner
        run: node test/planner.test.cjs
      - name: Bewaren in een bestand op het toestel
        run: node test/bestand.test.cjs
