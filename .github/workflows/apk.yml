name: Android-app (apk)

# Bouwt bij elke wijziging een apk met de webapp erin. Te downloaden onder Actions → deze run → Artifacts,
# en na een wijziging op main ook altijd via Releases → "Android-app" (bestand Voorraad.apk).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Apk bouwen
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Apk hernoemen
        run: cp android/app/build/outputs/apk/release/app-release.apk Voorraad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Voorraad-apk
          path: Voorraad.apk
      - name: Op Releases zetten
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Android-app
          body: Nieuwste versie van de Android-app. Download Voorraad.apk op je gsm en open het bestand om te installeren.
          files: Voorraad.apk
          make_latest: true
