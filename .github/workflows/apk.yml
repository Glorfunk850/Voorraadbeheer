name: Android-app (APK)

# Bouwt bij elke wijziging een APK van de webapp (map android/).
# Op de main-branch komt de APK ook bij "Releases", zodat je ze op je telefoon kunt downloaden.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: APK bouwen
        working-directory: android
        env:
          VERSIE_CODE: ${{ github.run_number }}
          VERSIE_NAAM: 1.${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Voorraad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Voorraad-apk
          path: Voorraad.apk
      - name: Op Releases zetten
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Voorraad APK 1.${{ github.run_number }}
          body: Download Voorraad.apk hieronder en open het bestand op je Android-telefoon.
          files: Voorraad.apk
          make_latest: true
